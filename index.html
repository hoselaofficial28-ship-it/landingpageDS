<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hosela Ornament | Angsa Kristal Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #FEFCF8; color: #2C2C2C; line-height: 1.5; scroll-behavior: smooth; }
    .moving-emblem-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
    .emblem { position: absolute; opacity: 0.08; font-size: clamp(100px, 15vw, 280px); color: #D4AF37; animation: floatEmblem 20s infinite ease-in-out; }
    .emblem-1 { top: 10%; left: -5%; animation-duration: 22s; }
    .emblem-2 { bottom: 15%; right: -3%; animation-duration: 25s; }
    .emblem-3 { top: 40%; right: 5%; animation-duration: 18s; }
    @keyframes floatEmblem { 0% { transform: translate(0,0) rotate(0deg); } 33% { transform: translate(20px,-25px) rotate(6deg); } 66% { transform: translate(-15px,15px) rotate(-4deg); } 100% { transform: translate(0,0) rotate(0deg); } }
    .main-content { position: relative; z-index: 2; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 700; }
    h2 { font-size: 2.3rem; margin-bottom: 2rem; text-align: center; color: #1e1e1e; }
    h2 span { color: #C6A43F; border-bottom: 2px solid #E4C580; display: inline-block; padding-bottom: 5px; }
    .btn-gold { display: inline-block; background: linear-gradient(135deg, #D4AF37, #B88A1A); color: #1E1A0C; font-weight: 700; padding: 14px 38px; border-radius: 48px; text-decoration: none; transition: 0.3s; box-shadow: 0 8px 20px rgba(212,175,55,0.25); text-align: center; }
    .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 16px 28px rgba(180,130,30,0.35); }
    .hero { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; margin: 30px 0 50px; }
    .hero-content { flex: 1; }
    .hero-content h1 { font-size: 3.3rem; line-height: 1.2; margin-bottom: 20px; }
    .hero-image { flex: 1; text-align: center; }
    .hero-image img { max-width: 100%; border-radius: 48px; box-shadow: 0 30px 40px -20px rgba(0,0,0,0.2); transition: 0.4s; }
    .benefit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 30px; margin-top: 20px; }
    .benefit-card { background: #FFF; padding: 30px 20px; border-radius: 32px; text-align: center; box-shadow: 0 12px 28px rgba(0,0,0,0.03); transition: 0.3s; }
    .benefit-card:hover { transform: translateY(-8px); box-shadow: 0 20px 35px rgba(0,0,0,0.07); }
    .benefit-icon { font-size: 2.8rem; color: #D4AF37; margin-bottom: 20px; }
    .video-preview { background: radial-gradient(circle at 20% 30%, #FDF8F0, #FAF5EA); border-radius: 60px; padding: 55px 30px; text-align: center; margin: 80px 0; }
    /* Container video dengan rasio 9:16 (vertikal seperti TikTok) */
    .video-wrapper { position: relative; padding-bottom: 177.78%; height: 0; border-radius: 32px; overflow: hidden; box-shadow: 0 25px 35px -12px rgba(0,0,0,0.2); background: #FAF5EA; }
    .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 35px; margin-top: 40px; }
    .product-card { background: white; border-radius: 32px; overflow: hidden; transition: 0.3s; text-align: center; padding-bottom: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 24px 36px -12px rgba(0,0,0,0.15); }
    .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
    .badge { background: #D4AF37; color: #1E1A0C; font-size: 0.7rem; font-weight: bold; padding: 5px 12px; border-radius: 60px; display: inline-block; margin-top: 6px; }
    .why-grid { display: flex; align-items: center; gap: 60px; flex-wrap: wrap; }
    .why-image { flex: 1; }
    .why-image img { width: 100%; border-radius: 48px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); }
    .why-list { flex: 1; }
    .why-list ul { list-style: none; }
    .why-list li { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
    .why-list li i { font-size: 1.7rem; color: #D4AF37; width: 40px; }
    .testimonial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 35px; }
    .testi-card { background: #FFF; border-radius: 28px; padding: 30px 25px; box-shadow: 0 12px 28px rgba(0,0,0,0.03); }
    .stars { color: #D4AF37; margin-bottom: 18px; letter-spacing: 3px; }
    .cta-final { background: linear-gradient(115deg, #1D1B17, #2A2721); border-radius: 60px; text-align: center; padding: 70px 25px; margin: 80px 0; }
    .cta-final h2 { color: #FEF6E6; }
    .cta-final p { color: #CBC3B0; margin-bottom: 35px; }
    .wa-float { position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); z-index: 99; text-decoration: none; }
    .wa-float:hover { transform: scale(1.08); background: #20b859; }
    .footer { text-align: center; padding: 40px 20px 20px; border-top: 1px solid #e9e2d4; color: #918b7c; font-size: 0.8rem; }
    .fade-up { opacity: 0; transform: translateY(35px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 768px) { .container { padding: 0 20px; } h2 { font-size: 1.8rem; } .hero-content h1 { font-size: 2.4rem; } .hero { flex-direction: column-reverse; text-align: center; } .why-grid { flex-direction: column; } }
  </style>
</head>
<body>

<div class="moving-emblem-bg">
  <div class="emblem emblem-1"><i class="fas fa-crown"></i></div>
  <div class="emblem emblem-2"><i class="fas fa-feather-alt"></i></div>
  <div class="emblem emblem-3"><i class="fas fa-gem"></i></div>
</div>

<div class="main-content">
  <div class="container">
    <div style="display:flex; justify-content:space-between; padding:24px 0">
      <div style="font-family:'Playfair Display'; font-size:1.5rem; font-weight:700; background:linear-gradient(135deg,#B48C3A,#E7C783); -webkit-background-clip:text; background-clip:text; color:transparent">
        HOSELA<br><small style="color:#9B7E40;">Ornament Dashboard</small>
      </div>
    </div>
  </div>

  <!-- Semua section diisi JS -->
  <div class="container fade-up" id="heroSection"></div>
  <div class="container fade-up" id="benefitSection"></div>
  <div class="container fade-up" id="videoSection"></div>
  <div class="container fade-up" id="productSection"></div>
  <div class="container fade-up" id="whySection"></div>
  <div class="container fade-up" id="testimonialSection"></div>
  <div class="container fade-up" id="ctaSection"></div>
  
  <div class="footer"><p>© 2025 Hosela Ornament Dashboard — Kemewahan dalam setiap detail.</p></div>
</div>

<a href="#" class="wa-float" id="waButton" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script>
// ========================== KONFIGURASI ==========================
// ★★★ HANYA EDIT BAGIAN INI ★★★
const config = {
    // Gambar utama hero (ganti dengan link gambar Anda)
    heroImage: "https://raw.githubusercontent.com/hoselaofficial28-ship-it/landingpageDS/refs/heads/main/2.jpg",
    
    // VIDEO MP4 (upload dulu ke GitHub, lalu masukkan raw link di sini)
    // Contoh: "https://raw.githubusercontent.com/username/repo/branch/video.mp4"
    videoUrl: "https://raw.githubusercontent.com/hoselaofficial28-ship-it/landingpageDS/refs/heads/main/video.mp4",  // ← GANTI DENGAN LINK MP4 ANDA
    
    // Gambar di bagian "Why Choose Us"
    whyImage: "https://placehold.co/600x800/F9F3EA/BF9A5A?text=Detail+Premium+Swan",
    
    // Produk (ganti link gambar masing-masing)
    products: [
        { name: "Ruby Red", image: "https://placehold.co/400x400/F5E8E0/C0392B?text=Red+Swan", bestSeller: true },
        { name: "Rose Quartz", image: "https://placehold.co/400x400/FAEFF5/DB7093?text=Pink+Swan", bestSeller: true },
        { name: "Pearl White", image: "https://placehold.co/400x400/FFFFFF/E0D5B9?text=White+Swan", bestSeller: false },
        { name: "Sapphire Blue", image: "https://placehold.co/400x400/DDEEF9/2C6E9E?text=Blue+Swan", bestSeller: true },
        { name: "Royal Purple", image: "https://placehold.co/400x400/F3EAF9/8E6CB2?text=Purple+Swan", bestSeller: false }
    ],
    
    // WhatsApp
    whatsappNumber: "6281234567890",
    whatsappMessage: "Halo Hosela, saya tertarik dengan Angsa Kristal Premium"
};
// ================================================================
// JANGAN UBAH DI BAWAH INI (kecuali Anda paham JavaScript)
// ================================================================

const heroTitle = "Sentuhan Mewah untuk Dashboard Mobil Anda";
const heroSubtitle = "Pajangan dashboard mobil motif angsa kristal premium yang dapat berputar otomatis dengan tenaga cahaya matahari, tanpa baterai.";
const ctaText = "Pesan Sekarang";
const benefits = [
    { icon: "fas fa-sun", title: "Berputar Otomatis", desc: "Dengan cahaya matahari" },
    { icon: "fas fa-battery-full", title: "Tanpa Baterai", desc: "Solar cell canggih" },
    { icon: "fas fa-gem", title: "Mewah & Eksklusif", desc: "Kristal premium" },
    { icon: "fas fa-car", title: "Elegance on The Road", desc: "Simbol kemewahan" }
];
const whyPoints = [
    "Desain angsa kristal yang elegan dan unik",
    "Menambah kesan mewah pada interior mobil",
    "Berputar otomatis saat terkena cahaya",
    "Tidak memerlukan baterai / listrik",
    "Cocok untuk hadiah premium dan kolektor"
];
const testimonials = [
    { text: "Dashboard mobil jadi terlihat jauh lebih elegan", name: "Niluh, Jakarta", rating: 5 },
    { text: "Unik dan berputar tanpa baterai, keren banget", name: "Dimas, Surabaya", rating: 5 },
    { text: "Bikin interior mobil terasa lebih mahal", name: "Sarah, Bandung", rating: 5 }
];
const ctaFinalTitle = "Upgrade Interior Mobil Anda Sekarang";
const ctaFinalSubtitle = "Miliki pajangan dashboard angsa kristal premium yang elegan dan berkelas.";
const ctaFinalButton = "Saya Mau Pesan";

function render() {
    // Hero
    document.getElementById("heroSection").innerHTML = `
        <div class="hero">
            <div class="hero-content">
                <h1>${heroTitle}</h1>
                <p style="margin:20px 0">${heroSubtitle}</p>
                <a href="#" class="btn-gold cta-link">${ctaText}</a>
            </div>
            <div class="hero-image">
                <img src="${config.heroImage}" alt="Angsa Kristal">
            </div>
        </div>
    `;
    
    // Benefit
    document.getElementById("benefitSection").innerHTML = `
        <h2><span>Keunggulan Premium</span></h2>
        <div class="benefit-grid">
            ${benefits.map(b => `
                <div class="benefit-card">
                    <div class="benefit-icon"><i class="${b.icon}"></i></div>
                    <h3>${b.title}</h3>
                    <p>${b.desc}</p>
                </div>
            `).join('')}
        </div>
    `;
    
    // Video - menggunakan tag video murni autoplay loop muted tanpa kontrol
    document.getElementById("videoSection").innerHTML = `
        <div class="video-preview">
            <h2 style="margin-bottom:1rem"><span>Gerakan Anggun yang Memukau</span></h2>
            <div class="video-wrapper">
                <video autoplay loop muted playsinline disablepictureinpicture controlslist="nodownload">
                    <source src="${config.videoUrl}" type="video/mp4">
                    Browser tidak mendukung video.
                </video>
            </div>
            <p style="margin-top:20px">Lihat kemewahan angsa kristal berputar lembut</p>
        </div>
    `;
    
    // Product
    document.getElementById("productSection").innerHTML = `
        <h2><span>Koleksi Warna Eksklusif</span></h2>
        <div class="product-grid">
            ${config.products.map(p => `
                <div class="product-card">
                    <img class="product-img" src="${p.image}" alt="${p.name}">
                    <h4>${p.name}</h4>
                    ${p.bestSeller ? '<div class="badge">Best Seller</div>' : ''}
                </div>
            `).join('')}
        </div>
    `;
    
    // Why Choose Us
    document.getElementById("whySection").innerHTML = `
        <div class="why-grid">
            <div class="why-image"><img src="${config.whyImage}" alt="Detail Premium"></div>
            <div class="why-list">
                <h2 style="text-align:left"><span>Kenapa Memilih Pajangan Angsa Premium Kami?</span></h2>
                <ul>
                    ${whyPoints.map(p => `<li><i class="fas fa-check-circle"></i> ${p}</li>`).join('')}
                </ul>
                <a href="#" class="btn-gold cta-link">Pesan Sekarang</a>
            </div>
        </div>
    `;
    
    // Testimonial
    document.getElementById("testimonialSection").innerHTML = `
        <h2><span>Testimonial Pelanggan Kami</span></h2>
        <div class="testimonial-grid">
            ${testimonials.map(t => `
                <div class="testi-card">
                    <div class="stars">${'<i class="fas fa-star"></i>'.repeat(t.rating)}</div>
                    <div class="testi-text">"${t.text}"</div>
                    <div class="testi-name">— ${t.name}</div>
                </div>
            `).join('')}
        </div>
    `;
    
    // CTA Final
    document.getElementById("ctaSection").innerHTML = `
        <div class="cta-final">
            <h2>${ctaFinalTitle}</h2>
            <p>${ctaFinalSubtitle}</p>
            <a href="#" class="btn-gold cta-link">${ctaFinalButton}</a>
        </div>
    `;
    
    const waLink = `https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(config.whatsappMessage)}`;
    document.getElementById("waButton").href = waLink;
    
    document.querySelectorAll(".cta-link").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            window.open(waLink, "_blank");
        });
    });
}

// Animasi
const faders = document.querySelectorAll('.fade-up');
const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
}, { threshold: 0.15 });
faders.forEach(el => obs.observe(el));

render();
setTimeout(() => {
    faders.forEach(el => {
        if(el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add('visible');
    });
}, 100);
</script>
</body>
</html>
